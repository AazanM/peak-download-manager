# Builds the Windows installer on GitHub's Windows machines (no Windows PC needed).
# Pushing a tag like v1.0.0 builds PeakSetup.exe and attaches it to that GitHub Release.
name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PeakSetup
          path: windows/Output/PeakSetup.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/Output/PeakSetup.exe
